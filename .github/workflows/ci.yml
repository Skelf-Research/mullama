name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libpulse-dev libflac-dev libvorbis-dev libopus-dev \
            libpng-dev libjpeg-dev libtiff-dev libwebp-dev \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev \
            libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --features full -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libpulse-dev libflac-dev libvorbis-dev libopus-dev \
            libpng-dev libjpeg-dev libtiff-dev libwebp-dev \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev \
            libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (no default features)
        run: cargo check --no-default-features

      - name: cargo check (async, streaming)
        run: cargo check --features "async,streaming"

      - name: cargo test (full features)
        run: cargo test --features full

  smoke-bindings:
    name: Smoke build bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libpulse-dev libflac-dev libvorbis-dev libopus-dev \
            libpng-dev libjpeg-dev libtiff-dev libwebp-dev \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev \
            libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: Swatinem/rust-cache@v2

      - name: Build FFI
        run: cargo build --release -p mullama-ffi

      - name: Build Python wheel (smoke)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          args: --release --out dist

      - name: Build Node module (smoke)
        working-directory: bindings/node
        run: |
          npm ci || npm install
          npm run build

  daemon-ui:
    name: Daemon with embedded UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libpulse-dev libflac-dev libvorbis-dev libopus-dev \
            libpng-dev libjpeg-dev libtiff-dev libwebp-dev \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev \
            libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - uses: Swatinem/rust-cache@v2

      - name: Build Web UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build daemon with embedded-ui
        run: cargo build --release --features daemon,embedded-ui

  docker-smoke:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Build Dockerfile (linux/amd64, no push)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
